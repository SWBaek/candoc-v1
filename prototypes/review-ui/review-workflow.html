_no:18,bbox:{l:99.00473999999997,t:646.13472,r:524.5040399999999,b:614.1442195894427,coord_origin:"BOTTOMLEFT"},charspan:[0,307]}],orig:"\uF8E7 This  standard  does  not  give  any  guidance  regarding  how  the  Area  EPS  operator  may  specify functional  parameter  settings  other  than  the  default  setting  within  the  specified ranges  of allowable settings , e.g., to coordinate with the existing Area EPS protection and control devices.",text:"\uF8E7 This  standard  does  not  give  any  guidance  regarding  how  the  Area  EPS  operator  may  specify functional  parameter  settings  other  than  the  default  setting  within  the  specified ranges  of allowable settings , e.g., to coordinate with the existing Area EPS protection and control devices.",formatting:null,hyperlink:null,enumerated:!1,marker:""},{self_ref:"#/texts/163",parent:{$ref:"#/groups/6"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:18,bbox:{l:98.99471999999997,t:604.91244,r:524.5050419999998,b:572.9219395894427,coord_origin:"BOTTOMLEFT"},charspan:[0,278]}],orig:"\uF8E7 This standard does not determine the communication network specifics nor the utilization of the DER provisions for a local DER interface capable of communicating ( local DER communication interface ) to support the information exchange requirements specified in this standard.",text:"\uF8E7 This standard does not determine the communication network specifics nor the utilization of the DER provisions for a local DER interface capable of communicating ( local DER communication interface ) to support the information exchange requirements specified in this standard.",formatting:null,hyperlink:null,enumerated:!1,marker:""},{self_ref:"#/texts/164",parent:{$ref:"#/groups/6"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:18,bbox:{l:99.00473999999997,t:563.6901599999999,r:524.5010339999998,b:531.7321985769229,coord_origin:"BOTTOMLEFT"},charspan:[0,246]}],orig:"\uF8E7 The  lower  and  upper  values  of  the ranges  of  allowable  settings for  voltage  and  frequency  trip settings specified in this standard for DER are not intended to limit the capabilities and settings of other equipment on the Area EPS. 9",text:"\uF8E7 The  lower  and  upper  values  of  the ranges  of  allowable  settings for  voltage  and  frequency  trip settings specified in this standard for DER are not intended to limit the capabilities and settings of other equipment on the Area EPS. 9",formatting:null,hyperlink:null,enumerated:!1,marker:""},{self_ref:"#/texts/165",parent:{$ref:"#/groups/6"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:18,bbox:{l:98.99597999999997,t:522.4776,r:524.481252,b:478.9966385769231,coord_origin:"BOTTOMLEFT"},charspan:[0,359]}],orig:"\uF8E7 For DER interconnections that include individual synchronous generator units rated 10 MVA and greater, and where the requirements of this standard conflict with the requirements of IEEE Std C50.12  or  IEEE  Std  C50.13,  the  requirements  of  IEEE  Std  C50.12  or  IEEE  Std  C50.13,  as relevant to the type of synchronous generator used, shall prevail.",text:"\uF8E7 For DER interconnections that include individual synchronous generator units rated 10 MVA and greater, and where the requirements of this standard conflict with the requirements of IEEE Std C50.12  or  IEEE  Std  C50.13,  the  requirements  of  IEEE  Std  C50.12  or  IEEE  Std  C50.13,  as relevant to the type of synchronous generator used, shall prevail.",formatting:null,hyperlink:null,enumerated:!1,marker:""},{self_ref:"#/texts/166",parent:{$ref:"#/body"},children:[],content_layer:"body",meta:null,label:"text",prov:[{page_no:18,bbox:{l:89.988,t:464.13114,r:524.5052999999999,b:397.984938576923,coord_origin:"BOTTOMLEFT"},charspan:[0,615]}],orig:"This standard applies to interconnection based on the aggregate nameplate rating of all the DER units that are  within  the  Local  EPS.  Supplemental  DER  devices  other  than  DER  units  may  be  used  to  achieve compliance with the requirements of this standard at the applicable reference point per Clause 4. These devices  are  not  required  to  be  co-located  with  the  DER  units,  but  shall  be  within  the  Local  EPS.  The requirements of this standard shall be met regardless of the location of the DER and supplemental DER devices within the Local EPS. These relationships are shown in Figure 2.",text:"This standard applies to interconnection based on the aggregate nameplate rating of all the DER units that are  within  the  Local  EPS.  Supplemental  DER  devices  other  than  DER  units  may  be  used  to  achieve compliance with the requirements of this standard at the applicable reference point per Clause 4. These devices  are  not  required  to  be  co-located  with  the  DER  units,  but  shall  be  within  the  Local  EPS.  The requirements of this standard shall be met regardless of the location of the DER and supplemental DER devices within the Local EPS. These relationships are shown in Figure 2.",formatting:null,hyperlink:null},{self_ref:"#/texts/167",parent:{$ref:"#/body"},children:[],content_layer:"body",meta:null,label:"footnote",prov:[{page_no:18,bbox:{l:90,t:107.81676000000004,r:234.49218000000002,b:99.96056988461532,coord_origin:"BOTTOMLEFT"},charspan:[0,46]}],orig:"8 As defined by authority having jurisdiction.",text:"8 As defined by authority having jurisdiction.",formatting:null,hyperlink:null},{self_ref:"#/texts/168",parent:{$ref:"#/body"},children:[],content_layer:"body",meta:null,label:"footnote",prov:[{page_no:18,bbox:{l:89.99831999999998,t:98.63675999999998,r:524.0512679999991,b:72.36272988461542,coord_origin:"BOTTOMLEFT"},charspan:[0,295]}],orig:"9 Refer to footnotes 80 and 99 on recommendations for utility practices to use trip settings on Area EPS equipment that conflict with this standard to occasionally and selectively accommodate worker safety practices or to safeguard distribution infrastructure while in an abnormal configuration.",text:"9 Refer to footnotes 80 and 99 on recommendations for utility practices to use trip settings on Area EPS equipment that conflict with this standard to occasionally and selectively accommodate worker safety practices or to safeguard distribution infrastructure while in an abnormal configuration.",formatting:null,hyperlink:null},{self_ref:"#/texts/169",parent:{$ref:"#/body"},children:[],content_layer:"furniture",meta:null,label:"page_footer",prov:[{page_no:18,bbox:{l:229.25634,t:52.41323999999997,r:384.95412,b:36.01363500000002,coord_origin:"BOTTOMLEFT"},charspan:[0,46]}],orig:"Copyright \xA9 2018 IEEE. All rights reserved. 17",text:"Copyright \xA9 2018 IEEE. All rights reserved. 17",formatting:null,hyperlink:null}]},"19":{number:19,width:612,height:792,image:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAOKArwDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAwQHAgEI/8QAXRAAAgEDAwIDBAMHDgwEBAMJAQIDAAQRBRIhBjETIkEHFFFhFTJxFiOBkZSz0hcYJDY3QlJVVnN1krHRMzQ1V2JydJWhsrTTQ1OCkzhUduIIJWaiweNj8WRlo/D/xAAbAQEAAwEBAQEAAAAAAAAAAAAABAUGAQMHAv/EADERAQABAgMEBwgDAQAAAAAAAAABAhEDBAUVUnHBEiExMzRRsRMUQWGBkaHRMkLhI//aAAwDAQACEQMRAD8A/SNKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKgeqdcuNDhs3t443M7yq2/PAW3lkGMfOMD7CarX3Ya8nTlvfsQ011NbRKG0iaPZ4mdxVS+ZPwYoOh0qh3XVGuw31hZI53T20tw7jR5mfKyKoHhB8qPMeSTnipjqbVtX06GxFhGH8UMbiVbVrhowAMEQqwYgk4JGcccc0FkpVItOvp53eFdOF5K0cTW7W charspan:[0,11]}],orig:"Local EPS 4",text:"Local EPS 4",formatting:null,hyperlink:null},{self_ref:"#/texts/223",parent:{$ref:"#/pictures/2"},children:[],content_layer:"body",meta:null,label:"text",prov:[{page_no:19,bbox:{l:445.3333333333333,t:429.3333333333333,r:480.3333333333333,b:421.6666666666667,coord_origin:"BOTTOMLEFT"},charspan:[0,11]}],orig:"Local EPS 5",text:"Local EPS 5",formatting:null,hyperlink:null},{self_ref:"#/texts/224",parent:{$ref:"#/groups/7"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:19,bbox:{l:89.99999999999999,t:379.284,r:524.2635000000001,b:350.8672442307692,coord_origin:"BOTTOMLEFT"},charspan:[0,325]}],orig:"NOTE  2-The  example  of  Local  EPS  2  includes  only  DER.  Depending  on  the  DER  rating,  requirements  of  this standard apply either at the PCC or the PoC. The DER unit in this example is able to meet requirements at its terminals without any supplemental DER device; the PoC coincides with the DER unit's terminals.",text:"NOTE  2-The  example  of  Local  EPS  2  includes  only  DER.  Depending  on  the  DER  rating,  requirements  of  this standard apply either at the PCC or the PoC. The DER unit in this example is able to meet requirements at its terminals without any supplemental DER device; the PoC coincides with the DER unit's terminals.",formatting:null,hyperlink:null,enumerated:!1,marker:""},{self_ref:"#/texts/225",parent:{$ref:"#/groups/7"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:19,bbox:{l:90,t:342.204,r:524.2121999999998,b:303.4642442307692,coord_origin:"BOTTOMLEFT"},charspan:[0,409]}],orig:"NOTE 3-The example of Local EPS 3 includes both DER units and load. Depending on the aggregate DER units' rating and the percent of average load demand, requirements of this standard apply either at the PCC or the PoC. The two (or more) DER units are able to meet requirements at its terminals without any supplemental DER device; the PoC coincides with the DER units' terminals; there are two (or more) PoCs.",text:"NOTE 3-The example of Local EPS 3 includes both DER units and load. Depending on the aggregate DER units' rating and the percent of average load demand, requirements of this standard apply either at the PCC or the PoC. The two (or more) DER units are able to meet requirements at its terminals without any supplemental DER device; the PoC coincides with the DER units' terminals; there are two (or more) PoCs.",formatting:null,hyperlink:null,enumerated:!1,marker:""},{self_ref:"#/texts/226",parent:{$ref:"#/groups/7"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:19,bbox:{l:90.00000000000003,t:294.80100000000004,r:524.2904999999998,b:245.6842442307693,coord_origin:"BOTTOMLEFT"},charspan:[0,541]}],orig:"NOTE 4-The example of Local EPS 4 includes a DER unit, a supplemental DER device, and load. Depending on the DER unit's rating and the percent of average load demand, requirements of this standard apply either at the PCC or the PoC. The DER unit is not able to meet requirements at its terminals without any supplemental DER device; the PoC is the point where the requirements of this standard are met by the DER unit in conjunction with the supplemental DER device exclusive of any load, if present, in the respective part of the Local EPS.",text:"NOTE 4-The example of Local EPS 4 includes a DER unit, a supplemental DER device, and load. Depending on the DER unit's rating and the percent of average load demand, requirements of this standard apply either at the PCC or the PoC. The DER unit is not able to meet requirements at its terminals without any supplemental DER device; the PoC is the point where the requirements of this standard are met by the DER unit in conjunction with the supplemental DER device exclusive of any load, if present, in the respective part of the Local EPS.",formatting:null,hyperlink:null,enumerated:!1,marker:""},{self_ref:"#/texts/227",parent:{$ref:"#/groups/7"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:19,bbox:{l:90.00000000000006,t:234.07799999999997,r:524.2445999999997,b:174.3819185769231,coord_origin:"BOTTOMLEFT"},charspan:[0,651]}],orig:"NOTE 5-The example of Local EPS 5 includes two (or more) DER units and a supplemental DER device but no load. Depending on the aggregate DER units' rating, requirements of this standard apply either at the PCC or the PoC. As indicated by the curved line, the PCC and PoC may be located well apart from each other. The two (or more) DER units are not able to meet requirements at their terminals without any supplemental DER device; the PoC is the point where the requirements of this standard are met by two (or more) DER units in conjunction with the supplemental DER device exclusive of any load, if present, in the respective part of the Local EPS.",text:"NOTE 5-The example of Local EPS 5 includes two (or more) DER units and a supplemental DER device but no load. Depending on the aggregate DER units' rating, requirements of this standard apply either at the PCC or the PoC. As indicated by the curved line, the PCC and PoC may be located well apart from each other. The two (or more) DER units are not able to meet requirements at their terminals without any supplemental DER device; the PoC is the point where the requirements of this standard are met by two (or more) DER units in conjunction with the supplemental DER device exclusive of any load, if present, in the respective part of the Local EPS.",formatting:null,hyperlink:null,enumerated:!1,marker:""},{self_ref:"#/texts/228",parent:{$ref:"#/body"},children:[],content_layer:"body",meta:null,label:"caption",prov:[{page_no:19,bbox:{l:182.34318,t:153.99540000000002,r:417.50255999999996,b:144.2665872727273,coord_origin:"BOTTOMLEFT"},charspan:[0,47]}],orig:"Figure 2 -Relationship of interconnection terms",text:"Figure 2 -Relationship of interconnection terms",formatting:null,hyperlink:null},{self_ref:"#/texts/229",parent:{$ref:" d between 5 s and 300 s.",text:"Transition between modes shall commence in no more than 30 s after the mode setting change is received at the local DER communication interface. Changes of control functional modes shall be executed such that the DER output is transitioned smoothly over a time period between 5 s and 300 s.",formatting:null,hyperlink:null},{self_ref:"#/texts/510",parent:{$ref:"#/body"},children:[],content_layer:"body",meta:null,label:"text",prov:[{page_no:33,bbox:{l:90.00020399999994,t:646.2934799999999,r:524.5074839999997,b:614.662170576923,coord_origin:"BOTTOMLEFT"},charspan:[0,301]}],orig:"Ramping of DER output is not required for control parameter setting changes. For all control and protective function parameter settings, the time following the input to the local  DER communication interface and preceding the point in time when the invoked action begins shall be no greater than 30 s.",text:"Ramping of DER output is not required for control parameter setting changes. For all control and protective function parameter settings, the time following the input to the local  DER communication interface and preceding the point in time when the invoked action begins shall be no greater than 30 s.",formatting:null,hyperlink:null},{self_ref:"#/texts/511",parent:{$ref:"#/body"},children:[],content_layer:"body",meta:null,label:"section_header",prov:[{page_no:33,bbox:{l:90,t:581.91462,r:276.43491,b:572.1793758895027,coord_origin:"BOTTOMLEFT"},charspan:[0,35]}],orig:"4.7 Prioritization of DER responses",text:"4.7 Prioritization of DER responses",formatting:null,hyperlink:null,level:2},{self_ref:"#/texts/512",parent:{$ref:"#/body"},children:[],content_layer:"body",meta:null,label:"text",prov:[{page_no:33,bbox:{l:90,t:558.20976,r:412.8,b:548.4819185769231,coord_origin:"BOTTOMLEFT"},charspan:[0,83]}],orig:"Requirements set forth in Clause 5 and Clause 6 shall be prioritized as follows: 46",text:"Requirements set forth in Clause 5 and Clause 6 shall be prioritized as follows: 46",formatting:null,hyperlink:null},{self_ref:"#/texts/513",parent:{$ref:"#/groups/13"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:33,bbox:{l:94.49967000000004,t:527.6134380000001,r:524.5229999999996,b:507.50212257692317,coord_origin:"BOTTOMLEFT"},charspan:[0,158]}],orig:"a) The  response  to  disabling  permit  service  setting  specified  in  4.6.1  shall  take  precedence  over  any requirements within Clause 5 and Clause 6.",text:"The  response  to  disabling  permit  service  setting  specified  in  4.6.1  shall  take  precedence  over  any requirements within Clause 5 and Clause 6.",formatting:null,hyperlink:null,enumerated:!0,marker:"a)"},{self_ref:"#/texts/514",parent:{$ref:"#/groups/13"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:33,bbox:{l:94.50167400000004,t:492.63361800000007,r:524.5510560000006,b:472.52230257692315,coord_origin:"BOTTOMLEFT"},charspan:[0,182]}],orig:"b) DER tripping  requirements  specified  in  6.2,  6.4.1,  and  6.5.1  shall  take  precedence  over  any  other requirements within Clause 5 and Clause 6, subject to the following:",text:"DER tripping  requirements  specified  in  6.2,  6.4.1,  and  6.5.1  shall  take  precedence  over  any  other requirements within Clause 5 and Clause 6, subject to the following:",formatting:null,hyperlink:null,enumerated:!0,marker:"b)"},{self_ref:"#/texts/515",parent:{$ref:"#/groups/13"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:33,bbox:{l:112.50260400000013,t:457.65379800000005,r:524.5580700000002,b:414.50249457692314,coord_origin:"BOTTOMLEFT"},charspan:[0,355]}],orig:"1) Where the prescribed trip duration settings for the respective voltage or frequency magnitude are set  at  least  160 ms  or  1%  of  the  prescribed  tripping  time,  whichever  is  greater,  beyond  the prescribed  ride-through  duration,  the  DER  shall  comply  with  the  ride-through  requirements specified in 6.4.2 and 6.5.2 prior to tripping.",text:"Where the prescribed trip duration settings for the respective voltage or frequency magnitude are set  at  least  160 ms  or  1%  of  the  prescribed  tripping  time,  whichever  is  greater,  beyond  the prescribed  ride-through  duration,  the  DER  shall  comply  with  the  ride-through  requirements specified in 6.4.2 and 6.5.2 prior to tripping.",formatting:null,hyperlink:null,enumerated:!0,marker:"1)"},{self_ref:"#/texts/516",parent:{$ref:"#/groups/13"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:33,bbox:{l:112.50160200000015,t:399.63399000000004,r:524.495945999999,b:379.5226745769231,coord_origin:"BOTTOMLEFT"},charspan:[0,177]}],orig:"2) In all other cases, the ride-through requirements shall apply until 160 ms or 1% of the prescribed tripping time, whichever is greater, prior to the prescribed tripping time.",text:"In all other cases, the ride-through requirements shall apply until 160 ms or 1% of the prescribed tripping time, whichever is greater, prior to the prescribed tripping time.",formatting:null,hyperlink:null,enumerated:!0,marker:"2)"},{self_ref:"#/texts/517",parent:{$ref:"#/groups/13"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:33,bbox:{l:94.50167400000015,t:364.65417,r:524.5640820000007,b:287.0030045769231,coord_origin:"BOTTOMLEFT"},charspan:[0,676]}],orig:"c) DER  ride-through  requirements  specified  in  6.4.2  and  6.5.2  shall  take  precedence  over  all  other requirements  within  Clause  5  and  Clause  6,  with  the  exception  of  tripping  requirements  listed  in item b) above. Ride-through may be terminated by the detection of an unintentional island specified in 8.1. However, false detection of an unintentional island that does not actually exist shall not justify non-compliance with ride-through requirements. Conversely, ride-through requirements specified in Clause 6  shall  not  inhibit  the  islanding  detection  performance  specified  in  8.1  where  a  valid unintentional islanding condition exists.",text:"DER  ride-through  requirements  specified  in  6.4.2  and  6.5.2  shall  take  precedence  over  all  other requirements  within  Clause  5  and  Clause  6,  with  the  exception  of  tripping  requirements  listed  in item b) above. Ride-through may be terminated by the detection of an unintentional island specified in 8.1. However, false detection of an unintentional island that does not actually exist shall not justify non-compliance with ride-through requirements. Conversely, ride-through requirements specified in Clause 6  shall  not  inhibit  the  islanding  detection  performance  specified  in  8.1  where  a  valid unintentional islanding condition exists.",formatting:null,hyperlink:null,enumerated:!0,marker:"c)"},{self_ref:"#/texts/518",parent:{$ref:"#/groups/13"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:33,bbox:{l:94.50267600000014,t:272.1345,r:524.5580699999992,b:217.52332257692308,coord_origin:"BOTTOMLEFT"},charspan:[0,452]}],orig:"d) The  voltage-active  power  mode  requirements  specified  in  5.4.2  and  frequency-droop  (frequencypower) response requirements specified in 6.5.2.7 shall take precedence over all other requirements within Clause 5 and Clause 6, with the exception of tripping and ride-through requirements listed in item b) and item c) above. If both voltage-active power and frequency-droop modes are active, the lesser of the power value shall take precedence.",text:"The  voltage-active  power  mode  requirements  specified  in  5.4.2  and  frequency-droop  (frequencypower) response requirements specified in 6.5.2.7 shall take precedence over all other requirements within Clause 5 and Clause 6, with the exception of tripping and ride-through requirements listed in item b) and item c) above. If both voltage-active power and frequency-droop modes are active, the lesser of the power value shall take precedence.",formatting:null,hyperlink:null,enumerated:!0,marker:"d)"},{self_ref:"#/texts/519",parent:{$ref:"#/groups/13"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:33,bbox:{l:94.50167400000022,t:202.65481799999998,r:524.5470480000006,b:159.56192457692305,coord_origin:"BOTTOMLEFT"},charspan:[0,373]}],orig:"e) The  response  to  active  power  limit  signal  specified  in  4.6.2  shall  take  precedence  over  all  other requirements  within  Clause  5  and  Clause  6,  with  the  exception  of  tripping  and  ride-through requirements listed in item b) and item c) above, and voltage-active power mode requirements and frequency-droop response requirements listed in item d).",text:"The  response  to  active  power  limit  signal  specified  in  4.6.2  shall  take  precedence  over  all  other requirements  within  Clause  5  and  Clause  6,  with  the  exception  of  tripping  and  ride-through requirements listed in item b) and item c) above, and voltage-active power mode requirements and frequency-droop response requirements listed in item d).",formatting:null,hyperlink:null,enumerated:!0,marker:"e)"},{self_ref:"#/texts/520",parent:{$ref:"#/groups/13"},children:[],content_layer:"body",meta:null,label:"list_item",prov:[{page_no:33,bbox:{l:94.500072,t:144.63329999999996,r:524.5123800000005,b:124.52198457692305,coord_origin:"BOTTOMLEFT"},charspan:[0,148]}],orig:"f) The  voltage  regulation  functions  specified  in  5.3  shall  take  precedence  over  any  remaining requirements within Clause 5 and Clause 6.",text:"The  voltage  regulation  functions  specified  in  5.3  shall  take  precedence  over  any  remaining requirements within Clause 5 and Clause 6.",formatting:null,hyperlink:null,enumerated:!0,marker:"f)"},{self_ref:"#/texts/521",parent:{$ref:"#/body"},children:[],content_layer:"body",meta:null,label:"footnote",prov:[{page_no:33,bbox:{l:90,t:89.45676000000003,r:523.99692,b:72.36052788461541,coord_origin:"BOTTOMLEFT"},charspan:[0,140]}],orig:"46 Based on t
